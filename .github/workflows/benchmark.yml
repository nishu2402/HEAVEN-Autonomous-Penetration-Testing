name: Benchmark — HEAVEN vs. DVWA

# Benchmarks pull Docker images and take minutes. Run weekly and on-demand,
# not on every push.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of scan runs to aggregate"
        required: false
        default: "3"

jobs:
  dvwa-benchmark:
    runs-on: ubuntu-latest
    # Head-room for the worst case: an on-demand 3-run dispatch, each scan
    # self-finalising at the 900s internal budget (~45 min) plus image pull and
    # install. The weekly scheduled run does a single scan and finishes far
    # sooner.
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HEAVEN
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyyaml

      - name: Verify Docker is available
        run: |
          docker --version
          docker compose version

      - name: Pull DVWA benchmark images (so the scan timer doesn't include image pulls)
        run: |
          docker pull ghcr.io/digininja/dvwa:latest
          docker pull mariadb:11

      - name: Run benchmark
        env:
          HEAVEN_RUN_BENCHMARKS: "1"
          # The weekly scheduled run aggregates a single scan (schedule passes no
          # input, so this falls back to 1) — that keeps the job fast and removes
          # the multi-scan amplification that made it flaky on a shared 2-CPU
          # runner. An on-demand dispatch can still request more runs for a deeper
          # mean +/- stddev.
          HEAVEN_BENCH_RUNS: ${{ inputs.runs || '1' }}
          # Internal graceful budget: the scan self-finalises here with the
          # findings it already has (full DVWA recall is reached in a few minutes,
          # long before this) and PERSISTS them, so on a slow runner it returns a
          # real result instead of being SIGKILLed by the subprocess timeout with
          # nothing on disk. Kept 300s below HEAVEN_BENCH_SCAN_TIMEOUT so the
          # graceful stop always wins the race.
          HEAVEN_SCAN_DEADLINE: "900"
          # Hard subprocess backstop, 300s above the internal budget — only ever
          # reached if the graceful finalise itself were to stall.
          HEAVEN_BENCH_SCAN_TIMEOUT: "1200"
        run: |
          pytest tests/benchmarks/test_dvwa_baseline.py -v -s \
            --junit-xml=benchmark-results.xml

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dvwa-benchmark-${{ github.run_id }}
          path: |
            tests/benchmarks/reports/
            benchmark-results.xml
          retention-days: 90

      - name: Print headline numbers to job summary
        if: always()
        run: |
          if [ -f tests/benchmarks/reports/dvwa_aggregated.md ]; then
            echo "## DVWA benchmark — aggregated" >> "$GITHUB_STEP_SUMMARY"
            cat tests/benchmarks/reports/dvwa_aggregated.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No aggregated report produced. See artifact for raw logs." >> "$GITHUB_STEP_SUMMARY"
          fi
