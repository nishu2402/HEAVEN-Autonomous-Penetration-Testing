name: Release — build + GitHub Release

# Trigger:
#   - Push a tag matching v* (e.g. v1.0.1, v2.0.0-rc1)
#   - Manual workflow_dispatch for dry-runs
#
# What it does:
#   1. Build sdist + wheel
#   2. Verify the wheel installs and `heaven --version` runs
#   3. Create a GitHub Release with the wheel + sdist attached
#
# NOTE: HEAVEN is NOT published to PyPI. Distribution is via GitHub Releases
# (and installing from source with `pip install -e .`). There is deliberately
# no PyPI upload step here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — skip the GitHub Release"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write    # for GitHub Release creation

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so setuptools_scm-style version logic works

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Verify wheel installs cleanly
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install --upgrade pip
          /tmp/verify-venv/bin/pip install dist/*.whl
          /tmp/verify-venv/bin/heaven --version
          /tmp/verify-venv/bin/heaven --help | head -5

      - name: Validate distribution metadata (no upload)
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 14

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes (banner + changelog + install)
        id: changelog
        run: |
          # One source of truth for release-note formatting (banner + this
          # version's CHANGELOG section + install/model steps). The banner is the
          # README hero poster + badges, tag-pinned, so EVERY release carries the
          # same in-sync banner. See scripts/build_release_notes.sh.
          scripts/build_release_notes.sh \
            "${{ steps.ver.outputs.version }}" \
            "${{ github.ref_name }}" \
            "${{ github.repository }}" > /tmp/release-notes.md
          head -60 /tmp/release-notes.md

      # NOTE: NVD_model.pkl is gitignored, so CI does not have it — the glob
      # below is skipped automatically (fail_on_unmatched_files defaults false).
      # ONE-TIME per release, the maintainer uploads data/models/NVD_model.pkl to
      # the created GitHub Release (drag-drop in the UI, or `gh release upload
      # <tag> data/models/NVD_model.pkl`) so `heaven download-model` can fetch it.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: "HEAVEN v${{ steps.ver.outputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            dist/*
            data/models/NVD_model.pkl
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # tag like v2.0.0-rc1 → prerelease
