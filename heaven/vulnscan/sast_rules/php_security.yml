# HEAVEN — PHP injection rules
# PHP superglobals ($_GET / $_POST / $_REQUEST / $_COOKIE) are direct,
# attacker-controlled sources, so a superglobal reaching a dangerous sink is a
# high-confidence finding. Patterns are pinned to the specific superglobals
# (not a bare metavariable) so ordinary local variables never trip them.

rules:

  - id: heaven.php.command-injection
    message: >-
      OS command injection: attacker-controlled request data ($_GET / $_POST /
      $_REQUEST / $_COOKIE) reaches a shell/exec sink. An attacker can run
      arbitrary commands with `;`, `|` or `$(...)`. Never pass request data to a
      shell — use escapeshellarg()/escapeshellcmd() at minimum, or avoid the
      shell entirely.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: CWE-78
      owasp: A03:2025 - Injection
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: system(<... $_GET ...>, ...)
          - pattern: system(<... $_POST ...>, ...)
          - pattern: system(<... $_REQUEST ...>, ...)
          - pattern: system(<... $_COOKIE ...>, ...)
          - pattern: exec(<... $_GET ...>, ...)
          - pattern: exec(<... $_POST ...>, ...)
          - pattern: exec(<... $_REQUEST ...>, ...)
          - pattern: exec(<... $_COOKIE ...>, ...)
          - pattern: shell_exec(<... $_GET ...>)
          - pattern: shell_exec(<... $_POST ...>)
          - pattern: shell_exec(<... $_REQUEST ...>)
          - pattern: shell_exec(<... $_COOKIE ...>)
          - pattern: passthru(<... $_GET ...>, ...)
          - pattern: passthru(<... $_POST ...>, ...)
          - pattern: passthru(<... $_REQUEST ...>, ...)
          - pattern: passthru(<... $_COOKIE ...>, ...)
          - pattern: popen(<... $_GET ...>, ...)
          - pattern: popen(<... $_POST ...>, ...)
          - pattern: popen(<... $_REQUEST ...>, ...)
          - pattern: proc_open(<... $_GET ...>, ...)
          - pattern: proc_open(<... $_POST ...>, ...)
          - pattern: proc_open(<... $_REQUEST ...>, ...)

  - id: heaven.php.file-inclusion
    message: >-
      File inclusion (LFI/RFI): a request-controlled path is passed to
      include/require. An attacker reads local files, or (with
      allow_url_include) executes a remote PHP payload. Never build an
      include path from request data; map to a fixed allow-list of filenames.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: CWE-98
      owasp: A03:2025 - Injection
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: include(<... $_GET ...>)
          - pattern: include(<... $_POST ...>)
          - pattern: include(<... $_REQUEST ...>)
          - pattern: include(<... $_COOKIE ...>)
          - pattern: include_once(<... $_GET ...>)
          - pattern: include_once(<... $_REQUEST ...>)
          - pattern: require(<... $_GET ...>)
          - pattern: require(<... $_REQUEST ...>)
          - pattern: require_once(<... $_GET ...>)
          - pattern: require_once(<... $_REQUEST ...>)

  - id: heaven.php.unsafe-deserialization
    message: >-
      Unsafe deserialization: unserialize() on request data ($_GET / $_POST /
      $_REQUEST / $_COOKIE) enables PHP object injection — a gadget chain can
      lead to code execution or file operations. Use json_decode() for
      untrusted data, or unserialize($x, ['allowed_classes' => false]).
    severity: ERROR
    languages: [php]
    metadata:
      cwe: CWE-502
      owasp: A08:2025 - Software or Data Integrity Failures
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: unserialize(<... $_GET ...>, ...)
          - pattern: unserialize(<... $_POST ...>, ...)
          - pattern: unserialize(<... $_REQUEST ...>, ...)
          - pattern: unserialize(<... $_COOKIE ...>, ...)

  - id: heaven.php.sqli
    message: >-
      SQL injection: request data is concatenated into a SQL string and run via
      mysqli/mysql/PDO. Use prepared statements with bound parameters
      (mysqli_prepare / PDO::prepare + bindValue).
    severity: ERROR
    languages: [php]
    metadata:
      cwe: CWE-89
      owasp: A03:2025 - Injection
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: mysqli_query($DB, <... $_GET ...>)
          - pattern: mysqli_query($DB, <... $_POST ...>)
          - pattern: mysqli_query($DB, <... $_REQUEST ...>)
          - pattern: mysqli_query($DB, <... $_COOKIE ...>)
          - pattern: mysql_query(<... $_GET ...>, ...)
          - pattern: mysql_query(<... $_POST ...>, ...)
          - pattern: mysql_query(<... $_REQUEST ...>, ...)
          - pattern: $DB->query(<... $_GET ...>)
          - pattern: $DB->query(<... $_POST ...>)
          - pattern: $DB->query(<... $_REQUEST ...>)

  - id: heaven.php.xss-echo
    message: >-
      Reflected XSS: request data is echoed into the response without encoding.
      Encode on output with htmlspecialchars($x, ENT_QUOTES, 'UTF-8') before
      printing any request-controlled value.
    severity: WARNING
    languages: [php]
    metadata:
      cwe: CWE-79
      owasp: A03:2025 - Injection
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: echo <... $_GET ...>;
          - pattern: echo <... $_REQUEST ...>;
          - pattern: print(<... $_GET ...>);
          - pattern: print(<... $_REQUEST ...>);
      - pattern-not: echo htmlspecialchars(...);
      - pattern-not: print(htmlspecialchars(...));

  - id: heaven.php.eval-injection
    message: >-
      Code injection: eval() / assert() on request data executes attacker PHP.
      There is no safe way to eval request data — remove it and use a explicit
      dispatch table for the intended behaviour.
    severity: ERROR
    languages: [php]
    metadata:
      cwe: CWE-95
      owasp: A03:2025 - Injection
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: eval(<... $_GET ...>)
          - pattern: eval(<... $_POST ...>)
          - pattern: eval(<... $_REQUEST ...>)
          - pattern: eval(<... $_COOKIE ...>)
