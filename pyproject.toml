[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heaven-pentest"
version = "4.3.0"
description = "HEAVEN — autonomous penetration-testing framework with AI-driven attack-chain planning, continuous monitoring, SAST/DAST, and 62 CLI commands"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Nisarg Chasmawala", email = "nisargkc@gmail.com"}
]
maintainers = [
    {name = "Nisarg Chasmawala", email = "nisargkc@gmail.com"}
]
# NOTE: PyPI trove `classifiers` and search `keywords` are intentionally omitted.
# HEAVEN is distributed via GitHub Releases + install-from-source, never uploaded
# to PyPI, so that discovery metadata would serve no purpose here. See
# release.yml (no publish-pypi job) and SECURITY.md.

dependencies = [
    # Dependency floors track the tested-green environment: the versions this
    # release is built and CI-tested against, so the manifest documents a known-
    # good baseline. A fresh `pip install` still resolves to the latest compatible
    # release. Where a package's current release dropped Python 3.11 (still a CI
    # matrix leg), the floor is the newest 3.11-compatible version (see numpy).
    # Core async
    "uvloop>=0.23.0; sys_platform != 'win32'",
    "aiohttp>=3.14.5",  # floor patched: request smuggling + Oct-2026 advisory batch
                        # (CVE-2026-111063/064/065/066/748/749/750, GHSA-2g87-pp6c-29x5,
                        # all fixed in 3.14.4; 3.14.5 is the latest) (OSV/pip-audit)
    "aiofiles>=25.1.0",
    # Database
    "asyncpg>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.6",
    # API server
    "fastapi>=0.162.0",
    "starlette>=1.10.0",  # floor >= 1.3.1 patched 6 advisories (fastapi allows older); pin tracks tested-latest
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",  # streamed multipart uploads (offline-artifact analysis);
                                 # floor patched: DoS via deformed boundary / quadratic
                                 # querystring / unbounded headers / preamble + arbitrary
                                 # file write + parameter smuggling (CVE-2024-53981,
                                 # CVE-2026-24486/40347/42561/53537-40, OSV)
    "websockets>=17.3",
    "slowapi>=0.1.10",
    # ML / Data — the CVSS risk model is a scikit-learn ExtraTreesRegressor loaded
    # with joblib (heaven/ml/risk_model.py); numpy/pandas back feature engineering.
    # There is deliberately no xgboost: the model was migrated to scikit-learn, and
    # the old "xgboost-cpu on Linux / xgboost on macOS" split was a frequent
    # cross-platform install failure (no CPU-only wheel on macOS, none on musl or
    # some ARM targets, forcing a from-source build). Dropping it keeps the base
    # install wheel-only on every OS.
    "scikit-learn>=1.9.1",  # floor patched: GHSA-jw8x-6495-233v (OSV)
    "numpy>=2.4.6",   # floor = newest numpy that still supports Python 3.11 (a CI
                      # matrix leg). numpy 2.5.0+ requires >=3.12, so on 3.11 pip
                      # resolves 2.4.6, while on 3.12+ it still pulls the latest
                      # (2.5.4+). pandas / scipy / scikit-learn all accept numpy 2.4.x.
    "pandas>=3.1.0",
    "joblib>=1.6.0",
    # Web recon (crawler uses the stdlib html.parser, so no lxml).
    "beautifulsoup4>=4.15.0",
    # Utilities
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",  # floor >= 2.14.2 fixes GHSA-4xgf-cpjx-pc3j (pip-audit)
    "rich>=15.0.0",
    "click>=8.5.0",  # floor >= 8.3.3 patched PYSEC-2026-2132 (OSV)
    "rich-click>=1.9.9",
    "python-dotenv>=1.2.4",  # floor >= 1.2.2 patched PYSEC-2026-2270 (OSV)
    "tzdata>=2026.5",  # bundled IANA tz database so HEAVEN_REPORT_TZ (e.g.
                       # Asia/Kolkata) resolves on any host — Windows ships no
                       # system zoneinfo, and minimal containers often omit it.
    "httpx>=0.28.1",
    # Security + the default offline data store. These power the documented
    # out-of-the-box experience (JWT sessions, vault encryption, SQLite mode),
    # so they belong in the base install rather than an extra.
    "pyjwt>=2.15.1",       # floor >= 2.13.0 patched multiple JWT advisories (OSV)
    "cryptography>=50.0.2",  # floor >= 50.0.0 clears 2026 advisories thru 49.x (OSV)
    "aiosqlite>=0.22.1",
    "defusedxml>=0.7.1",          # XXE-safe XML parsing (untrusted pom.xml / nmap output)
    "cvss>=3.6",                  # reference-grade CVSS v4.0 base scoring (v3.1 is in-house)
    "javalang>=0.13.0",          # pure-Python Java parser powering the SAST dataflow
                                 # refinement (heaven/vulnscan/java_dataflow.py):
                                 # constant-fold / reachability / interprocedural
                                 # taint over Semgrep's Java results
    # ── Full-power runtime deps (folded in from the old feature extras) ───────
    # HEAVEN ships "full power by default": every runtime capability is installed
    # with a plain `pip install`, no extras to remember. The [recon]/[reports]/
    # [lateral]/[deploy]/[scheduling]/[cloud-aws]/[gemini] extras below are kept
    # as backward-compatible aliases (now already-satisfied subsets of the base).
    # Only dev/test tooling and the alternate LLM providers (anthropic/openai)
    # and heavyweight GCP/Azure SDKs remain opt-in. All of the following ship
    # prebuilt wheels for every supported platform, so the base install stays
    # wheel-only (no compilers).
    "dnspython>=2.9.0",           # DNS enumeration (recon); floor patched: CVE-2026-114605 (OSV)
    "scapy>=2.8.0",               # raw-packet probes (recon); floor patched (OSV)
    "jinja2>=3.1.6",              # HTML report templating (reports); floor patched: CVE-2026-* template advisories (OSV)
    "reportlab>=5.1.0",           # PDF reports (reports)
    "tabulate>=0.10.0",            # table rendering (reports/CLI)
    "impacket>=0.13.1",           # SMB/Kerberos lateral movement (lateral)
    "asyncssh>=2.24.1",           # SSH credential testing (lateral); floor patched: SCP
                                  # path-traversal arbitrary write + AuthorizedKeysFile %u
                                  # directory escape (CVE-2026-54590/54591, OSV)
    "ldap3>=2.9.1",               # LDAP/AD enumeration (lateral)
    "pywinrm>=0.5.0",             # WinRM credential validation (lateral)
    "docker>=7.2.0",              # container recon (deploy)
    "kubernetes>=37.0.1",         # k8s recon (deploy)
    "apscheduler>=3.11.3",        # scheduled scans (scheduling)
    "alembic>=1.20.1",            # DB migrations (scheduling)
    "boto3>=1.43.119",              # AWS cloud recon (cloud-aws)
    "google-genai>=2.33.0",        # default AI provider SDK (Gemini) — AI works
                                  # as soon as a key is added; no extra install
    "playwright>=1.64.1",         # headless-browser DAST: DOM/stored-XSS execution
                                  # proof + JS-rendered crawl. The pip wheel ships
                                  # the driver; the browser bundle is fetched with
                                  # `playwright install chromium` (scripts/install.sh
                                  # runs this automatically; the code degrades
                                  # gracefully until it is present).
]

[project.urls]
Homepage      = "https://github.com/nishu2402/HEAVEN-Autonomous-Penetration-Testing"
Documentation = "https://github.com/nishu2402/HEAVEN-Autonomous-Penetration-Testing#readme"
Repository    = "https://github.com/nishu2402/HEAVEN-Autonomous-Penetration-Testing"
Issues        = "https://github.com/nishu2402/HEAVEN-Autonomous-Penetration-Testing/issues"
Changelog     = "https://github.com/nishu2402/HEAVEN-Autonomous-Penetration-Testing/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/nishu2402/HEAVEN-Autonomous-Penetration-Testing/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",       # floor >= 9.0.3 patched (OSV)
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    # Property-based tests (tests/test_properties.py) import hypothesis at module
    # load, so it must be present for the suite to collect. It is a TEST tool, not
    # a runtime dependency — hence it lives here, not in the base install.
    "hypothesis>=6.170.12",
    "black>=26.10.1",      # floor patched: CVE-2026-114134 (OSV)
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    # Flask backs the native offline vulnerable-app test target
    # (tests/benchmarks/native/vuln_app.py). Without it the native detector and
    # benchmark tests skip at collection — which both hides them from CI and made
    # the collected test count environment-dependent (CI counted 11 fewer).
    "flask>=3.1.3",  # floor patched (OSV)
    # google-genai backs the Gemini gateway regression tests
    # (tests/test_llm_gateway_gemini.py), which import real `google.genai.types`
    # (GenerateContentConfig/ThinkingConfig) to assert the dispatch path. Without
    # it those tests error at collection (ModuleNotFoundError: google) and the
    # collected count drifts between CI and local — same rationale as flask above.
    "google-genai>=2.33.0",
    # pypdf backs the PDF-report regression test (tests/test_integrations.py),
    # which reads the generated PDF back to assert its sections are present.
    # TEST-ONLY: no runtime code imports pypdf (reportlab does the writing), so it
    # belongs here, not in requirements.txt. Floor pinned past the parser-DoS
    # advisories: long-runtime/large-memory on outline + XForm retrieval and an
    # infinite loop in TreeObject.insert_child (CVE-2026-84309/84310/84311, fixed
    # 6.16.1) on top of the earlier CVE-2026-71852 / CVE-2026-71870 fixes, and the
    # later parser-DoS batch CVE-2026-113786/789/790/791/792/793/794/795 +
    # CVE-2026-115572/580/585 (fixed thru 6.21.2; 6.21.3 is the latest).
    "pypdf>=6.21.3",
]
# Heavyweight cloud-provider SDKs (opt-in). Each extra carries both the resource
# SDKs (compute/storage recon) and the identity/IAM SDKs the authenticated
# `heaven cloud iam --provider {gcp,azure}` audit needs, so a single
# `pip install -e ".[cloud-gcp]"` / ".[cloud-azure]" enables the whole provider.
cloud-gcp = [
    "google-cloud-compute>=1.56.0", "google-cloud-storage>=3.17.1",
    "google-api-python-client>=2.201.0",  # getIamPolicy (authenticated IAM audit)
    "google-auth>=2.62.0",                 # Application Default Credentials
]
cloud-azure = [
    "azure-mgmt-compute>=39.0.0", "azure-mgmt-storage>=25.3.0",
    "azure-identity>=1.27.0",              # DefaultAzureCredential; floor >= 1.16.1 patched (OSV)
    "azure-mgmt-authorization>=4.0.0",     # subscription-scope RBAC audit
    "azure-mgmt-resource>=26.0.0",         # subscription auto-resolution
]

# LLM provider SDKs. The default (Gemini / google-genai) now ships in the base
# install, so the AI layer works as soon as a key is added. anthropic / openai
# are alternate providers — install one if you prefer Claude or GPT.
#   pip install -e ".[anthropic]"  /  ".[openai]"  /  ".[llm]" (all three)
gemini = ["google-genai>=2.33.0"]        # alias — already in base
anthropic = ["anthropic>=2.3.0"]
openai = ["openai>=3.40.0"]
llm = ["google-genai>=2.33.0", "anthropic>=2.3.0", "openai>=3.40.0"]

# Feature extras — kept as BACKWARD-COMPATIBLE ALIASES. As of v1.0 every runtime
# capability ships in the base install (full power by default), so these are now
# already-satisfied subsets of `dependencies` above; `pip install -e ".[recon]"`
# still resolves for anyone with it in their scripts. The only genuine opt-ins
# left are dev tooling, the alternate LLM providers, and the heavy GCP/Azure SDKs.
recon = ["dnspython>=2.9.0", "scapy>=2.8.0"]
reports = ["jinja2>=3.1.6", "reportlab>=5.1.0", "tabulate>=0.10.0"]
lateral = ["impacket>=0.13.1", "asyncssh>=2.24.1", "ldap3>=2.9.1", "pywinrm>=0.5.0"]
# MITRE ATT&CK mapping ships a bundled dataset and talks TAXII over plain HTTP,
# so it needs no extra pip packages — hence there is no `mitre` extra.
deploy = ["docker>=7.2.0", "kubernetes>=37.0.1"]
scheduling = ["apscheduler>=3.11.3", "alembic>=1.20.1"]
cloud-aws = ["boto3>=1.43.119"]

# Every feature extra except dev tooling and the heavy cloud-provider SDKs
# (install [cloud-aws] / [cloud-gcp] / [cloud-azure] on their own) —
# `pip install -e ".[all]"`
all = [
    "dnspython>=2.9.0", "scapy>=2.8.0",
    "jinja2>=3.1.6", "reportlab>=5.1.0", "tabulate>=0.10.0",
    "impacket>=0.13.1", "asyncssh>=2.24.1", "ldap3>=2.9.1", "pywinrm>=0.5.0",
    "docker>=7.2.0", "kubernetes>=37.0.1",
    "apscheduler>=3.11.3", "alembic>=1.20.1",
    "playwright>=1.64.1",
    "google-genai>=2.33.0", "anthropic>=2.3.0", "openai>=3.40.0",
]

[project.scripts]
heaven = "heaven.main:cli"

[tool.setuptools.packages.find]
include = ["heaven", "heaven.*"]

[tool.setuptools.package-data]
# Ship non-Python runtime data inside the wheel so `pip install heaven-pentest`
# users get the SAST rulesets (heaven/vulnscan/sast_rules/*.yml) and the
# PostgreSQL bootstrap schema (heaven/db/schema.sql). Without this the wheel
# contains only .py files and those features silently degrade.
heaven = ["**/*.yml", "**/*.yaml", "**/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Silence transitional deprecations that originate in third-party dependencies,
# not in HEAVEN's own code. Python 3.14 pre-announces the removal of
# asyncio.iscoroutinefunction in 3.16; the async ecosystem (asyncssh, aiohttp,
# anyio) and CPython's own debug-mode run_in_executor still call it — HEAVEN
# never calls it directly (verified). Starlette's TestClient (a test-only
# dependency) still imports httpx. The equivalent uvloop / event-loop-policy and
# rich-click transitional warnings ARE fixed at our source (see
# heaven/utils/platform_detect.py and heaven/cli/_richconfig.py); only the
# vendored-library noise is filtered here.
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
    # Starlette's TestClient also type-annotates with anyio.abc.BlockingPortal,
    # an alias anyio 4.15 deprecated in favour of anyio.from_thread.BlockingPortal.
    # HEAVEN never references the alias directly (verified) — it is import-time
    # noise inside the same vendored test-only client as the httpx notice above.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # ldap3 imports pyasn1's renamed tagMap/typeMap at module load; google-genai
    # references a typing internal slated for removal in 3.17. Both are import-time
    # notices inside the vendored libraries — HEAVEN uses neither symbol directly.
    "ignore:tagMap is deprecated:DeprecationWarning",
    "ignore:typeMap is deprecated:DeprecationWarning",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
    # scapy imports cryptography's TLS group primitives at module load; the
    # offline pcap analyzer uses scapy only for packet parsing, not FFDH.
    "ignore:Diffie-Hellman over finite fields:UserWarning",
    "ignore:Diffie-Hellman over finite fields:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set EXPLICITLY so the lint is reproducible across ruff releases.
# CI installs ruff unpinned (`pip install ruff`), and ruff 0.16 broadened its
# *implicit* default selection (adding UP/I/BLE/SIM/etc.) — that alone turned a
# clean tree into 1800+ findings on a linter upgrade, with no source change.
# These four are ruff's long-standing default (pyflakes `F` + a curated
# pycodestyle `E` subset) — exactly the rules this codebase has always been
# linted against. Declaring them here makes any ruff version enforce the same
# set, so a future release can't silently break CI again.
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
# Reviewed test classes that recur intentionally in a network-pentest tool.
# Everything else stays active. (B310/urlopen is deliberately NOT skipped — it is
# suppressed per-line with `# nosec B310` so any *new* urlopen must be reviewed.)
#   B104: binding/handling "0.0.0.0" is intentional — the API server bind, the
#         OOB-callback listener that must catch a target's inbound connection,
#         and bind-any→loopback rewrites for the readiness probe / browser open.
#   B108: the single "/tmp" literal is a randomized staging path on the *remote*
#         SSH target (a command string), not a local temp file.
#   B608: table names in SQL strings come from class-level constants, not user
#         input. All user-supplied values use SQLAlchemy bound params (:name).
skips = ["B104", "B108", "B608"]

[tool.mypy]
# Mirror the CI type-check job (`mypy --ignore-missing-imports
# --no-strict-optional heaven/`) so a bare `mypy heaven/` locally reproduces
# exactly what CI runs — same reproducibility rationale as the pinned ruff rule
# set above. The type-check job is advisory (continue-on-error), so this keeps
# it green by catching drift on the dev host before a push, not by hiding it.
python_version = "3.12"
ignore_missing_imports = true
strict_optional = false
