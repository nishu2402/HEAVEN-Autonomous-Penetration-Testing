# HEAVEN Benchmark Ground Truth — DVWA (Damn Vulnerable Web Application)
#
# Source app: https://github.com/digininja/DVWA
# Image used: ghcr.io/digininja/dvwa (the official multi-arch image, native on
# arm64 so timing-based checks are not distorted by QEMU emulation).
# Difficulty levels covered: low + medium (high is hardened; impossible should
# yield zero findings).
#
# To add an entry: pick a documented DVWA vulnerability, identify the
# endpoint + parameter, set `category` to a canonical type from
# tests/benchmarks/metrics.py::CANONICAL_CATEGORIES.

target_app: dvwa
version: "1.10"
docker_image: ghcr.io/digininja/dvwa:latest   # pin to @sha256:... in CI
# Reach the target over 127.0.0.1 (not the "localhost" hostname): DVWA's newer
# image sets its session cookie with an explicit domain, and Python's cookiejar
# mishandles a dot-less "localhost" domain, which would silently drop the auth
# session. An IP host sidesteps that so the authenticated crawl actually works.
base_url: http://127.0.0.1:8080
auth:
  method: form_login
  url: /login.php
  username_field: username
  password_field: password
  credentials:
    username: admin
    password: password
  setup_url: /setup.php          # one-time DB init click
  security_url: /security.php    # difficulty toggle

vulnerabilities:

  # ── SQL Injection ───────────────────────────────────────────────────────

  - id: dvwa-sqli-low-id
    endpoint: /vulnerabilities/sqli/
    method: GET
    parameter: id
    category: sqli
    subtypes_ok: [sqli_error, sqli_union, sqli_boolean, sqli_time]
    owasp: A05_2025
    cwe: CWE-89
    severity: critical
    difficulty: low
    detection_required: true
    notes: "Direct $_GET['id'] interpolated into mysqli_query, no escaping."

  - id: dvwa-sqli-medium-id
    endpoint: /vulnerabilities/sqli/
    method: POST
    parameter: id
    category: sqli
    subtypes_ok: [sqli_error, sqli_union, sqli_boolean, sqli_time]
    owasp: A05_2025
    cwe: CWE-89
    severity: critical
    difficulty: medium
    detection_required: true
    notes: "Numeric-only client-side check + mysql_real_escape_string — bypassable by integer payloads."

  - id: dvwa-sqli-blind-low-id
    endpoint: /vulnerabilities/sqli_blind/
    method: GET
    parameter: id
    category: sqli
    subtypes_ok: [sqli_blind, sqli_boolean, sqli_time]
    owasp: A05_2025
    cwe: CWE-89
    severity: critical
    difficulty: low
    detection_required: true
    notes: "Blind SQLi — output suppressed but boolean/time-based payloads work."

  - id: dvwa-sqli-brute-low-username
    endpoint: /vulnerabilities/brute/
    method: GET
    parameter: username
    category: sqli
    subtypes_ok: [sqli_error, sqli_union, sqli_boolean]
    owasp: A05_2025
    cwe: CWE-89
    severity: critical
    difficulty: low
    # Opportunistic, not required for the recall floor — but a REAL vulnerability,
    # so it is credited when found instead of being scored as a false positive.
    detection_required: false
    notes: >-
      Brute-force login interpolates the username straight into the auth SELECT
      (SELECT * FROM users WHERE user='$user' AND password='$pass'; only $pass is
      md5'd), so it is genuinely error- and UNION-based SQL-injectable — distinct
      from, and co-located with, the no-throttle weak_auth issue (dvwa-brute-low).
      Verified live: `username='` returns the MySQL syntax error and a UNION
      SELECT surfaces the injected marker.

  # ── Cross-Site Scripting ────────────────────────────────────────────────

  - id: dvwa-xss-reflected-low-name
    endpoint: /vulnerabilities/xss_r/
    method: GET
    parameter: name
    category: xss
    subtypes_ok: [xss_reflected]
    owasp: A05_2025
    cwe: CWE-79
    severity: high
    difficulty: low
    detection_required: true
    notes: "Reflected XSS — name parameter echoed unescaped into HTML."

  - id: dvwa-xss-reflected-medium-name
    endpoint: /vulnerabilities/xss_r/
    method: GET
    parameter: name
    category: xss
    subtypes_ok: [xss_reflected]
    owasp: A05_2025
    cwe: CWE-79
    severity: high
    difficulty: medium
    detection_required: true
    notes: "str_replace('<script>') filter — bypassable by case variation or other tags."

  - id: dvwa-xss-stored-low-message
    endpoint: /vulnerabilities/xss_s/
    method: POST
    parameter: mtxMessage
    category: xss
    subtypes_ok: [xss_stored]
    owasp: A05_2025
    cwe: CWE-79
    severity: high
    difficulty: low
    # Stored XSS detection requires GET-back to confirm — harder for unauthenticated scanners
    detection_required: false
    notes: "Stored XSS in guestbook — payload persists across sessions."

  - id: dvwa-xss-stored-low-name
    endpoint: /vulnerabilities/xss_s/
    method: POST
    parameter: txtName
    category: xss
    subtypes_ok: [xss_stored]
    owasp: A05_2025
    cwe: CWE-79
    severity: high
    difficulty: low
    # The guestbook 'name' field is stored and reflected unescaped too — a real,
    # distinct stored-XSS sink. Opportunistic: credited when found, not required.
    detection_required: false
    notes: "Stored XSS in the guestbook name field (txtName), reflected unescaped."

  - id: dvwa-xss-fi-header-reflected
    endpoint: /vulnerabilities/fi/
    method: GET
    parameter: null
    category: xss
    subtypes_ok: [xss_reflected]
    owasp: A05_2025
    cwe: CWE-79
    severity: high
    difficulty: low
    # fi's demo include (file3.php) echoes Referer / X-Forwarded-For / User-Agent
    # unescaped, so those request headers are a genuine reflected-XSS sink. Verified
    # live. Header-based (no query parameter). Opportunistic, not required.
    detection_required: false
    notes: "Reflected XSS via Referer/X-Forwarded-For/User-Agent headers echoed unescaped by fi's included page."

  - id: dvwa-xss-csp-include
    endpoint: /vulnerabilities/csp/
    method: POST
    parameter: include
    category: xss
    subtypes_ok: [xss_reflected]
    owasp: A05_2025
    cwe: CWE-79
    severity: high
    difficulty: low
    # The CSP demo drops the 'include' value into an unescaped <script src='…'>,
    # a genuine reflected script-injection sink (the documented CSP-low exercise).
    # Opportunistic, not required.
    detection_required: false
    notes: "Reflected script injection — the 'include' value is written into a <script src> unescaped (CSP-low)."

  # ── Command Injection ───────────────────────────────────────────────────

  - id: dvwa-cmdi-low-ip
    endpoint: /vulnerabilities/exec/
    method: POST
    parameter: ip
    category: cmdi
    subtypes_ok: [command_injection, rce]
    owasp: A05_2025
    cwe: CWE-78
    severity: critical
    difficulty: low
    detection_required: true
    notes: "shell_exec($_REQUEST['ip']) — direct OS command injection via ; or && separators."

  - id: dvwa-cmdi-medium-ip
    endpoint: /vulnerabilities/exec/
    method: POST
    parameter: ip
    category: cmdi
    subtypes_ok: [command_injection, rce]
    owasp: A05_2025
    cwe: CWE-78
    severity: critical
    difficulty: medium
    detection_required: true
    notes: "Blacklist of ;,&&,| — bypassable with backticks, |, newline."

  # ── File Inclusion ──────────────────────────────────────────────────────

  - id: dvwa-lfi-low-page
    endpoint: /vulnerabilities/fi/
    method: GET
    parameter: page
    category: lfi
    subtypes_ok: [local_file_inclusion, path_traversal]
    owasp: A05_2025
    cwe: CWE-22
    severity: high
    difficulty: low
    detection_required: true
    notes: "include($_GET['page']) — full LFI, /etc/passwd readable."

  - id: dvwa-lfi-medium-page
    endpoint: /vulnerabilities/fi/
    method: GET
    parameter: page
    category: lfi
    subtypes_ok: [local_file_inclusion, path_traversal]
    owasp: A05_2025
    cwe: CWE-22
    severity: high
    difficulty: medium
    detection_required: true
    notes: "str_replace('../') applied — bypassable by ....// or absolute paths."

  # ── File Upload ─────────────────────────────────────────────────────────

  - id: dvwa-upload-low
    endpoint: /vulnerabilities/upload/
    method: POST
    parameter: uploaded
    category: file_upload
    subtypes_ok: [unrestricted_file_upload]
    owasp: A06_2025
    cwe: CWE-434
    severity: critical
    difficulty: low
    # Unrestricted upload requires multipart payload + post-upload retrieval — hard for unauth scanners
    detection_required: false
    notes: "No filename / content-type validation — direct PHP shell upload possible."

  # ── CSRF ────────────────────────────────────────────────────────────────

  - id: dvwa-csrf-low
    endpoint: /vulnerabilities/csrf/
    method: GET
    parameter: password_new
    category: csrf
    subtypes_ok: [csrf]
    owasp: A01_2025
    cwe: CWE-352
    severity: high
    difficulty: low
    detection_required: true
    notes: "Password change accepts GET request, no anti-CSRF token."

  # ── Open Redirect ───────────────────────────────────────────────────────

  - id: dvwa-open-redirect-low
    endpoint: /vulnerabilities/open_redirect/source/low.php
    method: GET
    parameter: redirect
    category: open_redirect
    subtypes_ok: [open_redirect, unvalidated_redirect]
    owasp: A01_2025
    cwe: CWE-601
    severity: medium
    difficulty: low
    # Open redirect is opportunistic — many scanners don't probe for it
    detection_required: false
    notes: "header('Location: ' . $_GET['redirect']) — arbitrary external redirect."

  # ── Weak Login (Brute-Forceable) ────────────────────────────────────────

  - id: dvwa-brute-low
    endpoint: /vulnerabilities/brute/
    method: GET
    parameter: password
    category: weak_auth
    subtypes_ok: [weak_credentials, default_credentials, no_rate_limit]
    owasp: A07_2025
    cwe: CWE-307
    severity: high
    difficulty: low
    # Brute-force detection requires the scanner to attempt enumeration — opt-in for most
    detection_required: false
    notes: "No login throttling — admin/password works without any backoff."

  # ── Infrastructure / configuration findings ─────────────────────────────
  # DVWA ships with none of the standard HTTP hardening, and exposes several
  # sensitive artifacts. These are all genuinely present (verified live), so
  # they are labeled here rather than scored as false positives when found.
  # Opportunistic (not required for the recall floor); the endpoint is the
  # host:port so a site-wide finding (reported once per host) matches.

  - id: dvwa-missing-security-headers
    endpoint: 127.0.0.1:8080
    method: GET
    parameter: null
    category: security_misconfig
    subtypes_ok: [csp_missing, clickjacking, x_content_type_missing,
                  referrer_policy_missing, permissions_policy_missing]
    owasp: A05_2025
    cwe: CWE-16
    severity: medium
    difficulty: low
    detection_required: false
    notes: "No CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy or Permissions-Policy on any response."

  - id: dvwa-insecure-session-cookie
    endpoint: 127.0.0.1:8080
    method: GET
    parameter: null
    category: insecure_cookie
    subtypes_ok: [cookie_no_secure, cookie_no_samesite]
    owasp: A05_2025
    cwe: CWE-614
    severity: medium
    difficulty: low
    detection_required: false
    notes: "PHPSESSID is set without the Secure or SameSite attributes."

  - id: dvwa-info-disclosure
    endpoint: 127.0.0.1:8080
    method: GET
    parameter: null
    category: info_disclosure
    subtypes_ok: [server_version_disclosure, technology_disclosure, sensitive_file]
    owasp: A05_2025
    cwe: CWE-200
    severity: low
    difficulty: low
    detection_required: false
    notes: "Server/X-Powered-By version banners, plus exposed setup.php, phpinfo.php and README.md."

  - id: dvwa-config-dist-readable
    endpoint: /config/config.inc.php.dist
    method: GET
    parameter: null
    category: broken_access_control
    subtypes_ok: [broken_access_control]
    owasp: A01_2025
    cwe: CWE-538
    severity: medium
    difficulty: low
    detection_required: false
    notes: "The config template config.inc.php.dist is served (readable) from the web root."

  - id: dvwa-rfi-low-page
    endpoint: /vulnerabilities/fi/
    method: GET
    parameter: page
    category: rfi
    subtypes_ok: [remote_file_inclusion]
    owasp: A05_2025
    cwe: CWE-98
    severity: high
    difficulty: low
    # allow_url_include is on, so ?page=http://... fetches a remote file. Verified
    # live: ?page=http://example.com/ returns the remote page's content.
    detection_required: false
    notes: "include($_GET['page']) with allow_url_include=On, so a remote URL is fetched and included (RFI)."

  - id: dvwa-csrf-tokenless-forms
    endpoint: /vulnerabilities/
    method: POST
    parameter: null
    category: csrf
    subtypes_ok: [csrf]
    owasp: A01_2025
    cwe: CWE-352
    severity: medium
    difficulty: low
    # Beyond the /csrf/ password-change exercise, DVWA's other state-changing
    # forms (exec, upload, guestbook, cryptography, captcha) also carry no
    # anti-CSRF token at low security.
    detection_required: false
    notes: "State-changing forms across /vulnerabilities/* omit any anti-CSRF token at low security."

  - id: dvwa-dom-xss
    endpoint: 127.0.0.1:8080
    method: GET
    parameter: null
    category: dom_xss
    subtypes_ok: [dom_xss, dom_xss_sink]
    owasp: A05_2025
    cwe: CWE-79
    severity: medium
    difficulty: low
    # DVWA has a documented DOM-based XSS exercise (/vulnerabilities/xss_d/) and
    # its shared page JavaScript passes URL-derived sources into HTML/JS sinks.
    # Opportunistic (a source→sink flow warrants manual confirmation).
    detection_required: false
    notes: "Client-side DOM XSS: URL-derived sources reach document.write/eval/window.open sinks in DVWA's page JS."
