# Ground truth for HEAVEN's network / service-tier benchmark against
# Metasploitable-2 — the canonical intentionally-vulnerable Linux VM
# (Rapid7). This is the service-tier analogue of dvwa.yaml: it scores
# recall / precision on host:port service findings (backdoors, RCE service
# CVEs, default credentials, cleartext protocols, EOL software) instead of
# web routes.
#
# tier: network → the metrics matcher keys on (service port, category), not
# on a URL path. A null `port` marks a host-level fact (SMB, host banner)
# matched on category alone. `service` and `cve` fields are human
# documentation; the loader ignores them.
#
# Run it live (the VM is NOT bundled — you point it at your own authorised lab):
#   HEAVEN_RUN_BENCHMARKS=1 HEAVEN_MSF2_TARGET=192.168.0.162 \
#     ./venv/bin/python -m pytest tests/benchmarks/test_msf2_baseline.py -v -s
#
# detection_required entries are the signature Metasploitable-2 findings a
# competent network assessment MUST surface — the recall floor is measured on
# these. The remaining entries are real supporting findings (labelled so a
# genuine detection is scored as a true positive, not a false positive), which
# is what lets precision be measured honestly.

target_app: metasploitable-2
version: "2.0.0"
tier: network
# base_url is the target host; the harness overrides it from HEAVEN_MSF2_TARGET.
base_url: "192.168.0.162"

vulnerabilities:
  # ── Signature critical / high findings (detection_required) ─────────────
  - id: msf2-vsftpd-backdoor
    service: vsftpd 2.3.4
    port: 21
    category: vulnerable_service
    cve: CVE-2011-2523
    owasp: "A06:2025-Vulnerable-and-Outdated-Components"
    cwe: CWE-506
    severity: critical
    difficulty: low
    detection_required: true
    notes: "vsftpd 2.3.4 smiley-face backdoor — unauthenticated root shell on :6200."

  - id: msf2-samba-usermap-rce
    service: Samba 3.x (smbd)
    port: 139
