# HEAVEN h2c-smuggling lab — the FRONT-END PROXY (deliberately misconfigured).
#
# It guards /admin on the HTTP/1.1 layer (returns 403), but forwards the
# hop-by-hop Upgrade/Connection headers to the backend for everything else. When
# the backend answers "101 Switching Protocols" to an "Upgrade: h2c", nginx goes
# into byte-pipe (tunnel) mode — and an HTTP/2 request sent through that tunnel
# to /admin reaches the backend directly, past the 403 rule above.
events {}

http {
    upstream h2c_backend {
        server backend:80;
    }

    server {
        listen 80;

        # Access control the proxy is relied on to enforce.
        location = /admin {
            return 403;
        }

        # The vulnerability: the client's Upgrade and Connection headers are
        # forwarded VERBATIM to the backend (the classic h2c-smuggling misconfig).
        # Forwarding $http_connection unchanged preserves the "HTTP2-Settings"
        # token the h2c upgrade requires, so the backend answers 101 and nginx
        # drops into byte-pipe mode — tunnelling HTTP/2 straight to the backend.
        location / {
            proxy_pass http://h2c_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }
    }
}
