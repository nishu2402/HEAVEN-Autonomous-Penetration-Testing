# Deliberately-insecure Mosquitto config for the HEAVEN IoT lab.
# Mosquitto 2.x denies anonymous access by default; this config re-enables it,
# reproducing the real-world "MQTT broker allows anonymous access" weakness
# (CWE-306) that HEAVEN's probe_mqtt confirms via a real CONNECT -> CONNACK 0.
listener 1883 0.0.0.0
allow_anonymous true
