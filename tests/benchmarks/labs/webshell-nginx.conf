# HEAVEN webshell lab — nginx static file server.
#
# The webroot holds INERT webshell-signature decoys (see webshell-root/README).
# nginx serves every file as STATIC TEXT and never executes anything: there is
# no PHP interpreter in this container, so a ".php" decoy is returned verbatim,
# exactly as a scanner would see a dropped shell whose banner/source is exposed.
# `default_type text/html` makes the ".php" bodies decode cleanly as text so the
# webshell signature engine reads them the way it reads a real compromised host.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    default_type text/html;

    location / {
        try_files $uri $uri/ =404;
    }
}
